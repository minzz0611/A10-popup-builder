<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PopBuilder · 안내 팝업 제작 스튜디오</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  :root{
    --blue:#2F6BFF;
    --blue-dark:#1451E0;
    --purple:#7B5CFA;
    --grad: linear-gradient(90deg,#7B5CFA 0%, #2FA8FF 100%);
    --grad-soft: linear-gradient(90deg,#eef0ff 0%, #eaf6ff 100%);
    --ink:#1B2130;
    --sub:#5B6472;
    --mute:#9199A6;
    --line:#E6E9EF;
    --panel:#F4F5F7;
    --panel-2:#EDEFF3;
    --card:#ffffff;
    --good:#12B886;
    --warn:#FF7A45;
    --danger:#F0416C;
    --focus:#2F6BFF;
    --shadow-sm: 0 1px 2px rgba(20,30,60,.05);
    --shadow-md: 0 4px 12px rgba(20,30,60,.08);
    --shadow-lg: 0 20px 50px rgba(20,30,60,.18);
    --radius:14px;
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#EBEEF3;color:var(--ink);height:100%;overflow:hidden;}
  #root{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#c9cdd5;border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:#a8adb7;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  [contenteditable]:focus{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px;}
  [contenteditable]{cursor:text;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script type="text/babel" data-presets="react" src="bundle.jsx"></script>
</body>
</html>
